name: Build Zombies24

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Compila Zombies.cs -> Zombies.dll contra las DLL del juego en libs/sc24
      - name: Compilar Zombies.dll
        run: |
          mkdir -p build
          cat > build/Zombies.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>netstandard2.0</TargetFramework>
              <AssemblyName>Zombies</AssemblyName>
              <LangVersion>latest</LangVersion>
              <EnableDefaultCompileItems>false</EnableDefaultCompileItems>
              <GenerateAssemblyInfo>false</GenerateAssemblyInfo>
              <NoWarn>CS0168;CS0219;CS0649;CS0414;NU1701</NoWarn>
            </PropertyGroup>
            <ItemGroup>
              <Compile Include="../Zombies.cs" />
              <SCDlls Include="../libs/sc24/*.dll" />
              <Reference Include="@(SCDlls)">
                <Private>false</Private>
              </Reference>
            </ItemGroup>
          </Project>
          EOF
          dotnet build build/Zombies.csproj -c Release -o build/out
          ls -la build/out

      # Empaqueta igual que empaquetar.py: base + DLL -> .scmod final
      - name: Empaquetar .scmod
        run: |
          mkdir -p salida
          python3 empaquetar.py base_zombies24.scmod build/out/Zombies.dll salida/Zombies24.scmod

      - name: Subir mod empaquetado
        uses: actions/upload-artifact@v4
        with:
          name: Zombies24
          path: salida/Zombies24.scmod
