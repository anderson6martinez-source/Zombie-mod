name: Compilar mod Zombies

on:
  push:
  workflow_dispatch:   # permite lanzarlo a mano desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Crear modinfo.json
        run: |
          cat > modinfo.json <<'JSON'
          {
            "Name": "Zombies",
            "Version": "1.0.0",
            "ApiVersion": "1.8.0.0",
            "Description": "Adds zombie creature types and related behavior.",
            "ScVersion": "2.4.0.0",
            "PackageName": "Zombies"
          }
          JSON

      - name: Comprobar DLL del juego
        run: |
          for f in Survivalcraft.dll Engine.dll EntitySystem.dll; do
            test -f "$f" || { echo "Falta $f en la raiz del repositorio"; exit 1; }
          done

      - name: Compilar y empaquetar
        run: dotnet build Zombies.csproj -c Release

      - name: Subir el .scmod
        uses: actions/upload-artifact@v4
        with:
          name: Zombies_API1.8.scmod
          path: Zombies_API1.8.scmod

      - name: Subir DLL y modinfo.json sueltos
        uses: actions/upload-artifact@v4
        with:
          name: Zombies_dll_y_modinfo
          path: |
            modinfo.json
            bin/Release/netstandard2.0/Zombies.dll
